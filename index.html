<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Job Hunt</title>
<link rel="manifest" href="/manifest.json" />
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
<meta name="theme-color" content="#0b1120" media="(prefers-color-scheme: dark)" />
<link rel="apple-touch-icon" href="/icon-192.svg" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<!-- The bottom bar, the drawer, the exam switcher and the first-run exam
     question, shared with the prep page. Deferred, so it runs after
     prep/exams.js at the foot of the body has defined EXAMS, and so its
     stylesheet lands after the one below. -->
<script src="/nav.js" defer></script>
<link rel="stylesheet" href="/fonts/fonts.css" />
<!-- The two faces used above the fold, fetched in parallel with the CSS
     rather than after it, so the first paint is not the fallback. -->
<link rel="preload" href="/fonts/rajdhani-700-latin.woff2" as="font" type="font/woff2" crossorigin />
<link rel="preload" href="/fonts/orbitron-var-latin.woff2" as="font" type="font/woff2" crossorigin />
<style>
  /* Light is the base; dark is the same tokens redefined under the system
     preference, so the app follows the phone. Literal hexes below were
     replaced by these — a literal is a colour that only works in one scheme. */
  :root {
    color-scheme: light dark;
    --bg:#ffffff;
    --panel:#f8faf9;
    --panel-border:#e2e8ec;
    --surface-2:#eef3f0;
    --surface-2-border:#dbe6e0;
    --tint:#eef8f1;
    --header-bg:#ffffffee;
    --accent:#16a34a;
    --accent-soft:#15803d;
    --text:#0f172a;
    --muted:#5b6b7a;
    --dim:#8794a1;
    --bad:#dc2626;
    --warn:#b45309;
    --on-accent:#ffffff;        /* text on a filled accent button */
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#0b1120;
      --panel:#131c31;
      --panel-border:#1e293b;
      --surface-2:#0f172a;
      --surface-2-border:#243049;
      --tint:#14351f;
      --header-bg:#0b1120ee;
      --accent:#22c55e;
      --accent-soft:#4ade80;
      --text:#e2e8f0;
      --muted:#94a3b8;
      --dim:#64748b;
      --bad:#f87171;
      --warn:#f59e0b;
      --on-accent:#0b1120;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: var(--font-ui);
    background: var(--bg); color: var(--text);
    /* Cleared by nav.js too; stated here so the bottom bar never covers the
       last job card during the moment before that stylesheet lands. */
    padding-bottom: calc(74px + env(safe-area-inset-bottom));
  }
  header {
    padding: 10px 12px; position: sticky; top: 0;
    background: var(--header-bg); backdrop-filter: blur(8px); z-index: 10;
    border-bottom: 1px solid var(--panel-border);
  }
  h1 { font-size: 17px; margin: 0; }
  .sub { color: var(--dim); font-size: 11.5px; line-height: 1.35; }

  /* Card sections: a title, and where there is more behind it, a way through. */
  .sec { padding: 14px 12px 0; }
  .view-all { background: none; border: 0; padding: 0; color: var(--accent-soft); font: inherit;
              font-size: 12px; font-weight: 700; cursor: pointer; }

  /* ── The exam you chose ────────────────────────────────────────────────
     The first thing on the home screen, because it is the thing every other
     screen in the app is about. Pattern, marking and date live here rather
     than three taps away in the syllabus: they are what you need to know
     before you decide what to do today. */

  /* Round icon tiles — everything you actually do, one tap from the home screen. */


  .list { padding: 0 12px; display: flex; flex-direction: column; gap: 10px; }
  .card {
    background: var(--panel); border: 1px solid var(--panel-border); border-radius: 14px; padding: 14px;
    box-shadow: 0 1px 3px rgba(15,23,42,.06);
  }
  /* A tap should feel like it landed — the same rule learn.html uses. */
  button:active:not(:disabled), a.syllabus-link:active, .hero-cta:active { filter: brightness(.92); }
  .card-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
  .org { font-size: 11px; color: var(--dim); text-transform: uppercase; letter-spacing: 0.4px; }
  .post { font-size: 15px; font-weight: 600; margin: 3px 0 8px; }
  .badge { font-size: 10px; font-weight: 700; padding: 3px 8px; border-radius: 20px; white-space: nowrap; }
  .badge.NEW { background: #16a34a22; color: var(--accent-soft); }
  .badge.UPDATED { background: #2563eb1f; color: var(--accent-soft); }
  .badge.DEADLINE_APPROACHING { background: #dc262622; color: var(--bad); }
  .badge.CLOSED { background: #64748b22; color: var(--dim); }
  .meta { font-size: 12.5px; color: var(--dim); line-height: 1.7; }
  .meta b { color: var(--text); }
  .links { display: flex; gap: 10px; margin-top: 10px; }
  .links a {
    font-size: 12.5px; color: var(--accent-soft); text-decoration: none; font-weight: 600;
  }
  .empty { text-align: center; color: var(--muted); padding: 40px 20px; font-size: 13.5px; line-height: 1.6; }
  .retry { margin-top: 12px; font-family: inherit; font-size: 12.5px; font-weight: 700;
           color: var(--on-accent); background: var(--accent); border: 0; border-radius: 8px;
           padding: 9px 16px; min-height: 38px; cursor: pointer; }
  .install-banner {
    margin: 14px 12px 0; padding: 12px 14px; background: var(--tint); border: 1px solid #16a34a55;
    border-radius: 10px; font-size: 12.5px; color: var(--muted); display: none;
  }
  .install-banner.show { display: block; }
  /* Refreshing sits with the data age it refreshes, not in a floating circle
     over the middle of the page — which is where a fixed button ends up once
     the home screen is the exam rather than one long list. */
  .age-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  #refreshBtn { min-height: 34px; padding: 0 4px; }
  .est { font-size: 11px; color: var(--warn); border: 1px solid #f59e0b55;
         border-radius: 6px; padding: 1px 5px; margin-left: 4px; vertical-align: middle; }
  #lastUpdated.stale { color: var(--warn); }
  /* The qualification picker itself lives in the drawer with the other
     settings. This is the nudge on the list that opens it — without one, a
     first-time visitor would never find the control that makes the list
     theirs. */
  .qual-prompt { margin: 0 12px 10px; padding: 11px 13px; border-radius: 10px;
                 background: var(--tint); border: 1px solid #16a34a55; color: var(--muted);
                 font-size: 12.5px; text-align: left; width: calc(100% - 24px);
                 font-family: inherit; cursor: pointer; display: none; }
  .qual-prompt.show { display: block; }
  .qual-prompt b { color: var(--accent-soft); }
  /* Job card rows — label on the left, answer on the right, so "have I
     applied / which exam / when is it" are read without hunting. */
  .jrow { display: flex; gap: 10px; align-items: baseline; padding: 7px 0;
          border-top: 1px solid var(--panel-border); font-size: 12.5px; }
  .jlab { flex: 0 0 88px; color: var(--dim); font-size: 11px; text-transform: uppercase;
          letter-spacing: .4px; }
  .jval { flex: 1; min-width: 0; color: var(--text); line-height: 1.5; }
  .ok-tag { color: var(--accent-soft); font-weight: 700; font-size: 11px; }
  .no-tag { color: var(--warn); font-weight: 700; font-size: 11px; }
  .study-now { display: block; margin-top: 12px; text-align: center; text-decoration: none;
               font-size: 13.5px; font-weight: 800; color: var(--on-accent); background: var(--accent);
               border-radius: 10px; padding: 12px 14px; }
  /* Other openings — present, but plainly secondary to the exam you chose. */
  .other-fold { padding: 14px 12px 0; }
  .other-fold summary { cursor: pointer; font-size: 12.5px; font-weight: 700; color: var(--muted);
                        list-style: none; display: flex; align-items: center; gap: 6px;
                        min-height: 40px; }
  .other-fold summary::-webkit-details-marker { display: none; }
  .other-fold summary::after { content: "▾"; color: var(--accent-soft); font-size: 11px; }
  .other-fold[open] summary::after { content: "▴"; }
  /* The countdown column. A deadline tracker's one job is telling you how long
     you have, so it is a number in the corner of the eye rather than a date to
     parse out of a sentence. */
  .other-cd { flex: 0 0 46px; text-align: center; padding: 6px 0; border-radius: 10px;
              background: var(--surface-2); border: 1px solid var(--panel-border);
              align-self: flex-start; }
  .cd-num  { display: block; font-size: 19px; font-weight: 800; line-height: 1;
             font-family: var(--font-display); font-variant-numeric: tabular-nums; }
  .cd-unit { display: block; font-size: 9.5px; text-transform: uppercase;
             letter-spacing: .5px; color: var(--dim); margin-top: 2px; }
  .cd-none { display: block; font-size: 9.5px; color: var(--dim); line-height: 1.3; padding: 4px 2px; }
  .other-row.is-urgent .other-cd { border-color: var(--bad); background: #7f1d1d33; }
  .other-row.is-urgent .cd-num   { color: var(--bad); }
  .other-row.is-soon   .other-cd { border-color: var(--warn); }
  .other-row.is-soon   .cd-num   { color: var(--warn); }
  .other-vac  { color: var(--accent-soft); font-weight: 700; }
  .other-elig { font-size: 11.5px; color: var(--muted); margin-top: 3px; line-height: 1.45; }
  .other-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
  /* Applying is the point of the screen, so it is a real target, not a link
     buried in a line of grey text. */
  .other-apply, .other-mark, .other-switch {
    font-family: inherit; font-size: 11.5px; font-weight: 700; cursor: pointer;
    padding: 7px 11px; border-radius: 8px; text-decoration: none;
    border: 1px solid var(--panel-border); background: var(--surface-2); color: var(--text);
  }
  .other-apply { border-color: var(--accent); color: var(--accent-soft); }
  .other-row { display: flex; align-items: flex-start; gap: 10px; padding: 13px 0;
               border-top: 1px solid var(--panel-border); }
  .other-main { flex: 1; min-width: 0; }
  .other-org { font-size: 10.5px; color: var(--dim); text-transform: uppercase; letter-spacing: .4px; }
  .other-post { font-size: 13px; font-weight: 600; margin-top: 2px; line-height: 1.35; }
  .other-meta { font-size: 11.5px; color: var(--muted); margin-top: 3px; }
  .other-switch-legacy { flex: 0 0 auto; font-family: inherit; font-size: 11.5px; font-weight: 700;
                  color: var(--accent-soft); background: var(--tint);
                  border: 1px solid var(--surface-2-border); border-radius: 20px;
                  padding: 8px 11px; min-height: 40px; cursor: pointer; white-space: nowrap; }
  .other-none { align-self: center; font-size: 10.5px; color: var(--dim);
                padding: 7px 2px; text-align: left;
                max-width: 90px; line-height: 1.3; }
  /* Closed rows read as past, not as something to act on. */
  .other-row.is-closed .other-post { color: var(--muted); }
  .other-row.is-closed .other-org { opacity: .75; }
  .hidden { display: none !important; }
  .applied-row { display:flex; gap:8px; align-items:center; margin-top:10px; flex-wrap:wrap;
                 border-top:1px solid var(--panel-border); padding-top:10px; }
  .applied-q { font-size:12.5px; color:var(--dim); }
  .btn-y, .btn-n { font-size:12px; font-weight:700; padding:5px 12px; border-radius:20px;
                   border:1px solid var(--surface-2-border); background:var(--surface-2); color:var(--text); cursor:pointer; }
  .btn-y.on { background:var(--accent); color:var(--bg); border-color:transparent; }
  .applied-tag { font-size:11px; font-weight:700; color:var(--accent-soft); }
  .syllabus-link { display:inline-block; margin-top:10px; font-size:13px; font-weight:700;
                   color:var(--bg); background:var(--accent); padding:8px 14px; border-radius:8px;
                   text-decoration:none; }
  .syllabus-box { margin-top:10px; padding:12px; border-radius:10px;
                  background:var(--surface-2); border:1px solid #16a34a33; }
  .syllabus-pattern { font-size:12px; color:var(--accent-soft); font-weight:600; }
  .syllabus-sections { font-size:12px; color:var(--dim); margin-top:4px; line-height:1.6; }
</style>
</head>
<body data-page="jobs">
<header>
  <div class="nav-bar">
    <button class="nav-burger" id="nav-hamburger" aria-label="Open menu" aria-expanded="false">
      <svg class="nav-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
           stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
    </button>
    <div class="nav-title">
      <h1 id="screen-title">Jobs</h1>
      <div class="nav-exam" id="nav-exam"></div>
    </div>
  </div>
</header>

<!-- Only the openings for the exam being prepared for. A job list that mixed
     all three would put the student back in the position of working out which
     rows were theirs — which is the job the app is supposed to do. -->
<div class="list" id="examJobs"><div class="empty">Loading…</div></div>

<div class="sec">
  <div class="age-row">
    <span class="sub" id="lastUpdated">Loading…</span>
    <button class="view-all" id="refreshBtn" onclick="load()">↻ Refresh</button>
  </div>
</div>

<details class="sec other-fold hidden" id="otherFold">
  <summary id="otherCount">Government openings</summary>
  <div id="otherJobs"></div>
</details>

<!-- Private sector, kept apart. The two are prepared for and applied to in
     completely different ways — one is a syllabus and a written paper months
     out, the other is a CV and an interview — so mixing them in one list makes
     the reader sort them mentally every time they open the screen. -->
<details class="sec other-fold hidden" id="privateFold">
  <summary id="privateCount">Private openings</summary>
  <div id="privateJobs"></div>
</details>

<details class="sec other-fold hidden" id="closedFold">
  <summary id="closedCount">Closed</summary>
  <div id="closedJobs"></div>
</details>

<button class="qual-prompt" id="qualPrompt">
  <b>Tell the app what you studied</b><br>
  and it can say whether you are eligible for this opening. Tap to set it.
</button>

<div class="install-banner" id="installBanner">
  📲 Tap your browser's Share/Menu button → "Add to Home Screen" to install this as an app.
</div>

<script src="/prep/exams.js"></script>
<script>
const SUPABASE_URL = "https://xbjgmudcgjiompbroayr.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhiamdtdWRjZ2ppb21wYnJvYXlyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYyODc1MjgsImV4cCI6MjEwMTg2MzUyOH0.fdcA5b87PZwaDg7jdOMol4Dnf9k9pylSiO38aMl1VLQ";

/* Every screen in this app is about one exam. This one shows the openings for
   that exam and nothing else — a mixed list would put the student back to
   working out which rows are theirs, which is the job the app exists to do. */
let allJobs = [];
let applied = {};          // job_id -> true
let qualification = null;
let loadFailed = false;

/* Device id, shared with the prep page so one person is one history. */
const DEVICE_KEY = 'jobhunt_device_id';
let deviceId = localStorage.getItem(DEVICE_KEY);
if (!deviceId) {
  deviceId = (crypto.randomUUID && crypto.randomUUID()) ||
    ('id-' + Date.now() + '-' + Math.random().toString(36).slice(2));
  localStorage.setItem(DEVICE_KEY, deviceId);
}

/* The ingestion writes profile as "B.Tech CSE" / "Graduate" / "Intermediate",
   while the seeded rows use "person1" / "person2". Both are in the table right
   now, so matching on either alone hides half the jobs. */
const PROFILE_ALIASES = { 'person1': 'B.Tech CSE', 'person2': 'Intermediate' };
const normProfile = p => PROFILE_ALIASES[p] || p || '';

/* A B.Tech holder is eligible for anything asking for less. Eligibility is
   inclusive downwards — the opposite would hide jobs you can actually apply
   for, which is the more damaging mistake for someone job hunting. */
const ELIGIBLE_FOR = {
  'B.Tech CSE':   ['B.Tech CSE', 'Graduate', 'Intermediate'],
  'Graduate':     ['Graduate', 'Intermediate'],
  'Intermediate': ['Intermediate'],
};
function eligibility(job) {
  if (!qualification) return null;                       // nothing to say yet
  const allowed = ELIGIBLE_FOR[qualification] || [];
  return allowed.indexOf(normProfile(job.profile)) !== -1;
}

/** The exam this whole screen is about. */
function currentExam() {
  return (window.JobhuntNav && window.JobhuntNav.exam) || null;
}
function examHref(section) {
  return window.JobhuntNav ? window.JobhuntNav.learnHref(section) : '/learn.html#' + section;
}

async function saveProgress(payload) {
  try {
    await fetch('/api/progress', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(Object.assign({ device_id: deviceId }, payload)),
    });
  } catch (e) { /* offline: localStorage below still holds it */ }
}

function loadLocal() {
  try { applied = JSON.parse(localStorage.getItem('jobhunt_applied')) || {}; } catch (e) { applied = {}; }
  qualification = localStorage.getItem('jobhunt_qualification') || null;
}
function saveLocal() {
  try {
    localStorage.setItem('jobhunt_applied', JSON.stringify(applied));
    if (qualification) localStorage.setItem('jobhunt_qualification', qualification);
  } catch (e) {}
}

function setApplied(jobId, yes) {
  if (yes) applied[jobId] = true; else delete applied[jobId];
  saveLocal();
  saveProgress({ action: 'applied', job_id: jobId, applied: !!yes });
  render();
}

async function load() {
  loadFailed = false;
  try {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/jobs?select=*&order=is_estimated.asc,deadline.asc.nullslast`, {
      headers: { apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}` }
    });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const rows = await res.json();
    if (!Array.isArray(rows)) throw new Error('unexpected response');
    allJobs = rows;
  } catch (e) {
    // Say so, and offer the way out. Leaving "Loading…" on screen forever
    // reads as a broken app rather than as a phone with no signal — and the
    // prep, which needs no network at all, looks broken with it.
    loadFailed = true;
    allJobs = [];
  }
  stampAge();
  render();
}

function stampAge() {
  const el = document.getElementById('lastUpdated');
  if (loadFailed) { el.textContent = 'Could not refresh the openings'; el.className = 'sub stale'; return; }
  const newest = allJobs.reduce((max, j) => {
    const t = new Date(j.updated_at || j.last_checked_at || 0).getTime();
    return t > max ? t : max;
  }, 0);
  if (!newest) { el.textContent = 'Data age unknown'; el.className = 'sub'; return; }
  const ageH = Math.floor((Date.now() - newest) / 3600000);
  const at = new Date(newest);
  const when = ageH < 24
    ? at.toLocaleTimeString('en-IN', { hour: 'numeric', minute: '2-digit' })
    : at.toLocaleDateString('en-IN', { day: 'numeric', month: 'short' });
  el.textContent = 'Updated ' + when + (ageH >= 24 ? ` · ${Math.floor(ageH / 24)}d old` : ageH >= 1 ? ` · ${ageH}h old` : ' · just now');
  el.className = ageH >= 48 ? 'sub stale' : 'sub';
}

function render() {
  const exam = currentExam();
  const list = document.getElementById('examJobs');
  document.getElementById('qualPrompt').classList.toggle('show', !qualification);

  if (loadFailed) {
    list.innerHTML = '<div class="empty">Could not reach the openings.<br>' +
      'Your preparation works offline — only this list needs a connection.' +
      '<br><button class="retry" onclick="load()">Try again</button></div>';
    /* Nothing loaded, so nothing belongs in either fold — and #otherNote,
       which this used to write to, no longer exists: reading it threw and
       left both folds showing the last successful load's counts. */
    document.getElementById('otherFold').classList.add('hidden');
    document.getElementById('privateFold').classList.add('hidden');
    document.getElementById('closedFold').classList.add('hidden');
    return;
  }
  if (!allJobs.length) { list.innerHTML = '<div class="empty">Loading…</div>'; return; }

  /* Closed applications are not openings. Two of the seven tracked rows say
     "(applications closed)" in their own title while still carrying status
     UPDATED — the ingestion never set CLOSED on them — so the status field
     alone would leave them sitting among the live ones. Both signals are read,
     and the wording matched is the explicit one, not a guess. */
  const live = allJobs.filter(j => !isClosed(j));
  const closed = allJobs.filter(isClosed);
  const mine = exam ? live.filter(j => { const e = examForJob(j); return e && e.key === exam.key; }) : [];
  list.innerHTML = mine.length
    ? mine.map(cardHtml).join('')
    : '<div class="empty">No opening is being tracked for ' +
      escapeHtml(exam ? exam.short : 'this exam') + ' right now.<br>' +
      'The nightly run adds them as they are published — your preparation carries on either way.</div>';

  /* Everything else, behind a fold.

     This screen is scoped to the selected exam, and it leads with it — but
     scoping it to ONLY that exam lost three of the seven openings entirely:
     the Air Force, railway and Singareni notifications match no exam in the
     app, so no amount of switching would ever reveal them. A tracker that
     silently drops what it tracked is a worse failure than a mixed list, so
     the rest are here, folded away, each saying which exam it belongs to. */
  const others = live.filter(j => mine.indexOf(j) === -1);
  const govt    = others.filter(j => sectorOf(j) === 'government');
  const private_ = others.filter(j => sectorOf(j) === 'private');

  document.getElementById('otherFold').classList.toggle('hidden', govt.length === 0);
  document.getElementById('otherCount').textContent = `Government openings (${govt.length})`;
  document.getElementById('otherJobs').innerHTML = govt.map(otherHtml).join('');

  document.getElementById('privateFold').classList.toggle('hidden', private_.length === 0);
  document.getElementById('privateCount').textContent = `Private openings (${private_.length})`;
  document.getElementById('privateJobs').innerHTML = private_.map(otherHtml).join('');

  /* Closed, kept rather than dropped: one you applied for is still the exam
     you are sitting, and one you missed is worth seeing once so the next
     cycle is not a surprise. */
  document.getElementById('closedFold').classList.toggle('hidden', closed.length === 0);
  document.getElementById('closedCount').textContent = `Closed (${closed.length})`;
  document.getElementById('closedJobs').innerHTML = closed.map(j => {
    const e = examForJob(j);
    return `<div class="other-row is-closed">
      <div class="other-main">
        <div class="other-org">${escapeHtml(j.organization)}</div>
        <div class="other-post">${escapeHtml(j.post_name)}</div>
        <div class="other-meta">${escapeHtml(j.deadline_text || 'applications closed')}${
          applied[j.id] ? ' · <span class="ok-tag">you applied</span>' : ''}</div>
      </div>
      ${e && applied[j.id]
        ? `<button class="other-switch" data-switch-exam="${escapeHtml(e.key)}">${escapeHtml(e.short)} →</button>`
        : `<span class="other-none">closed</span>`}
    </div>`;
  }).join('');
}

/** Applications closed. Three signals, because no single one is reliable
    here: the status where the ingestion set it; the notification's own
    wording where it did not — "(applications closed)" in a title is explicit,
    not an inference; and a real closing date that has passed. The date is
    only trusted when the row is not an estimate — closing an opening on a
    guessed date would hide one you could still apply for, the more damaging
    of the two mistakes. */
function isClosed(j){
  if (String(j.status || '').toUpperCase() === 'CLOSED') return true;
  const text = `${j.post_name || ''} ${j.deadline_text || ''}`;
  if (/\bapplications?\s+closed\b|\bclosed\b\s*\)/i.test(text)) return true;
  if (j.deadline && !j.is_estimated) {
    const t = new Date(j.deadline).getTime();
    if (t && t < Date.now()) return true;
  }
  return false;
}

/* Switching from an opening is the same switch the ☰ menu offers — one route,
   so the app cannot end up with two ways to change the thing everything else
   depends on. */
document.addEventListener('click', e => {
  const b = e.target.closest && e.target.closest('[data-switch-exam]');
  if (b && window.JobhuntNav) window.JobhuntNav.openChangeExam();
});

/* One card, answering the four things a tracked opening has to answer: have I
   applied, which exam is it, when is that exam, and what do I do about it. */
/* Private-sector employers this feed carries, by name. India's private banks
   are the hard case: "Bank" reads as public sector, but Federal, South Indian,
   Tamilnad Mercantile, Nainital, Karur Vysya and the rest are private
   companies with completely different hiring. Naming them is more honest than
   a clever rule that gets them wrong quietly. */
const PRIVATE_NAMES = [
  'federal bank', 'south indian bank', 'nainital bank', 'tamilnad mercantile', 'tmb',
  'karur vysya', 'city union', 'rbl', 'hdfc', 'icici', 'axis bank', 'kotak',
  'indusind', 'bandhan', 'dcb bank', 'csb bank', 'dhanlaxmi', 'ujjivan',
  'equitas', 'au small', 'fincare', 'yes bank', 'idfc first', 'jana small',
  'esaf', 'suryoday', 'utkarsh', 'shivalik', 'capital small',
  'reliance', 'infosys', 'wipro', 'tcs', 'tech mahindra', 'hcl', 'cognizant',
  'accenture', 'capgemini', 'amazon', 'flipkart', 'private limited', 'pvt',
];

/**
 * Government or private, for the two lists on this screen.
 *
 * A heuristic, and labelled as one: it reads a name, not a company register.
 * It defaults to GOVERNMENT because this is a government-job tracker and the
 * feed behind it is overwhelmingly public sector — so the failure mode is a
 * private role appearing in the government list, not a government notification
 * going missing, which is the one that would actually cost an application.
 */
function sectorOf(j) {
  const name = ((j.organization || '') + ' ' + (j.post_name || '')).toLowerCase();
  if (PRIVATE_NAMES.some(p => name.includes(p))) return 'private';
  return 'government';
}

/** Days until a real closing date. Null when there is no confirmed date —
    never a guess, which is the rule the whole tracker is built on. */
function daysLeft(j) {
  if (!j.deadline) return null;
  const t = new Date(j.deadline).getTime();
  if (isNaN(t)) return null;
  return Math.ceil((t - Date.now()) / 86400000);
}

/** "… — 470 Posts" → "470". The feed puts the vacancy count in the title, and
    it is the number people scan for first. */
function vacanciesOf(j) {
  const m = /(?:^|[–—-]\s*)([\d,]{1,7})\s*Posts?\b/i.exec(j.post_name || '');
  return m ? m[1] : null;
}

/** Title without the trailing "– N Posts", since the count gets its own chip
    and repeating it wastes the line that has to carry the actual role. */
function titleOf(j) {
  return String(j.post_name || '').replace(/\s*[–—-]\s*[\d,]+\s*Posts?\b\s*$/i, '').trim()
      || String(j.post_name || '');
}

/**
 * One opening in the folded list.
 *
 * This used to be three lines — organisation, title, and the raw
 * deadline_text — which on a list of fifty read as fifty near-identical grey
 * paragraphs, repeated the words "reported by FreeJobAlert, confirm on the
 * official notification" fifty times, and offered NO WAY TO APPLY. Every field
 * it needed was already on the client; `select=*` had been fetching them all
 * along and the renderer threw them away.
 *
 * What a row has to answer, in the order it is asked: how long have I got,
 * what is it, am I eligible, and where do I apply.
 */
function otherHtml(j) {
  const e = examForJob(j);
  const left = daysLeft(j);
  const vac = vacanciesOf(j);
  const elig = eligibility(j);

  /* Urgency is the whole point of a deadline tracker, so it is a colour and a
     number rather than a sentence to read. Three days is the band where an
     application stops being something you can leave until the weekend. */
  const urgency = left === null ? '' : left <= 3 ? ' is-urgent' : left <= 7 ? ' is-soon' : '';
  const countdown = left === null
    ? `<span class="cd-none">date TBA</span>`
    : `<span class="cd-num">${left}</span><span class="cd-unit">day${left === 1 ? '' : 's'}</span>`;

  const link = j.apply_url || j.notification_url;

  return `<div class="other-row${urgency}">
    <div class="other-cd">${countdown}</div>
    <div class="other-main">
      <div class="other-org">${escapeHtml(j.organization)}${
        vac ? ` · <span class="other-vac">${escapeHtml(vac)} posts</span>` : ''}</div>
      <div class="other-post">${escapeHtml(titleOf(j))}</div>
      ${j.eligibility ? `<div class="other-elig">${escapeHtml(j.eligibility)}${
        elig === true ? ' <span class="ok-tag">you qualify</span>' : ''}</div>` : ''}
      <div class="other-meta">${
        left === null
          ? escapeHtml(j.deadline_text || 'closing date TBA')
          : `Closes ${escapeHtml(new Date(j.deadline).toLocaleDateString('en-IN',
              { day: 'numeric', month: 'short' }))}`
      }${j.is_estimated ? ' <span class="est">estimate</span>' : ''}${
        applied[j.id] ? ' · <span class="ok-tag">applied</span>' : ''}</div>
      <div class="other-actions">
        ${link ? `<a class="other-apply" href="${escapeHtml(link)}" target="_blank" rel="noopener">Open notification →</a>` : ''}
        ${applied[j.id]
          ? `<button class="other-mark" data-unapply="${escapeHtml(j.id)}">Undo</button>`
          : `<button class="other-mark" data-apply="${escapeHtml(j.id)}">Mark applied</button>`}
        ${e
          ? `<button class="other-switch" data-switch-exam="${escapeHtml(e.key)}">${escapeHtml(e.short)} →</button>`
          /* Said plainly, because the alternative is an opening that looks as
             prepared-for as the others and is not. It sits with the actions
             rather than alone in the right margin, where fifty repetitions of
             it were the only thing the column contained. */
          : `<span class="other-none">no syllabus yet</span>`}
      </div>
    </div>
  </div>`;
}

function cardHtml(j) {
  const exam = currentExam();
  const when = exam && window.JobhuntNav ? window.JobhuntNav.examWhen(exam) : null;
  const elig = eligibility(j);
  return `
    <div class="card">
      <div class="card-top">
        <div>
          <div class="org">${escapeHtml(j.organization)}</div>
          <div class="post">${escapeHtml(j.post_name)}</div>
        </div>
        <span class="badge ${escapeHtml(j.status)}">${escapeHtml(String(j.status || '').replace('_',' '))}</span>
      </div>

      <div class="jrow">
        <span class="jlab">Application</span>
        <span class="jval">${applied[j.id]
          ? `<span class="applied-tag">✓ Applied</span> <button class="btn-n" data-unapply="${escapeHtml(j.id)}">Undo</button>`
          : `<button class="btn-y" data-apply="${escapeHtml(j.id)}">Mark as applied</button>`}</span>
      </div>
      <div class="jrow">
        <span class="jlab">Closes</span>
        <span class="jval">${escapeHtml(j.deadline_text || 'TBA')}${
          j.is_estimated ? ' <span class="est">estimate</span>' : ''}</span>
      </div>
      ${exam ? `
      <div class="jrow">
        <span class="jlab">Exam</span>
        <span class="jval">${escapeHtml(exam.name)}</span>
      </div>
      <div class="jrow">
        <span class="jlab">Exam date</span>
        <span class="jval">${escapeHtml(when ? when.text : 'not announced')}</span>
      </div>
      <div class="jrow">
        <span class="jlab">Paper</span>
        <span class="jval">${escapeHtml(exam.pattern)}</span>
      </div>` : ''}
      ${j.eligibility ? `
      <div class="jrow">
        <span class="jlab">Eligibility</span>
        <span class="jval">${escapeHtml(j.eligibility)}${
          elig === null ? '' : elig
            ? ' <span class="ok-tag">you qualify</span>'
            : ' <span class="no-tag">below your stated qualification</span>'}</span>
      </div>` : ''}
      ${j.location ? `<div class="jrow"><span class="jlab">Location</span><span class="jval">${escapeHtml(j.location)}</span></div>` : ''}
      ${j.pay_scale ? `<div class="jrow"><span class="jlab">Pay</span><span class="jval">₹${escapeHtml(j.pay_scale)}</span></div>` : ''}

      <div class="links">
        ${j.notification_url ? `<a href="${escapeHtml(j.notification_url)}" target="_blank" rel="noopener">📄 Notification</a>` : ''}
        ${j.apply_url ? `<a href="${escapeHtml(j.apply_url)}" target="_blank" rel="noopener">🔗 Portal</a>` : ''}
      </div>
      <a class="study-now" href="${examHref('study')}">Study now →</a>
    </div>
  `;
}

/* One delegated handler, rather than rebinding per card. */
document.addEventListener('click', (e) => {
  const y = e.target.closest && e.target.closest('[data-apply]');
  if (y) { setApplied(y.getAttribute('data-apply'), true); return; }
  const n = e.target.closest && e.target.closest('[data-unapply]');
  if (n) { setApplied(n.getAttribute('data-unapply'), false); }
});

function escapeHtml(s) {
  if (!s) return '';
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* The qualification picker lives in the menu, with the other settings, so
   there is one of it rather than one per page. nav.js writes it; this page
   only has to re-render. */
document.getElementById('qualPrompt').addEventListener('click', () => {
  if (window.JobhuntNav) window.JobhuntNav.openDrawer();
});
document.addEventListener('jobhunt:qualification', (e) => {
  qualification = (e.detail && e.detail.qualification) || null;
  saveLocal();
  render();
});

/* Switching exam rebuilds this screen too: which openings belong here, what
   the cards say about the exam, and where "Study now" goes. */
document.addEventListener('jobhunt:exam', render);
document.addEventListener('DOMContentLoaded', render);

loadLocal();

if (!window.matchMedia('(display-mode: standalone)').matches) {
  document.getElementById('installBanner').classList.add('show');
}

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/sw.js');
}

load();
</script>
</body>
</html>
