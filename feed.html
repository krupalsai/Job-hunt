<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Instinct · Job Hunt</title>
<meta name="description" content="Everything Instinct sends — lessons, quizzes, job lists, mocks, revision — in one place inside the app." />
<link rel="manifest" href="/manifest.json" />
<meta name="theme-color" content="#f5f6f8" media="(prefers-color-scheme: light)" />
<meta name="theme-color" content="#0b0f16" media="(prefers-color-scheme: dark)" />
<link rel="apple-touch-icon" href="/icon-192.svg" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<script src="/nav.js" defer></script>
<link rel="stylesheet" href="/fonts/fonts.css" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%234f46e5'/%3E%3Ccircle cx='16' cy='16' r='8.5' fill='none' stroke='white' stroke-width='3'/%3E%3Ccircle cx='16' cy='16' r='3' fill='white'/%3E%3C/svg%3E" />
<style>
  /* The same tokens as both other pages, so the feed reads as the same app. */
  :root{
    color-scheme: light dark;
    --bg:#f5f6f8; --panel:#ffffff; --panel-border:#e4e7ec;
    --surface-2:#f1f3f6; --surface-2-border:#e2e6eb;
    --tint:#eef0fe; --header-bg:#f5f6f8ee;
    --accent:#4f46e5; --accent-soft:#4338ca;
    --accent-tint:#4f46e514; --accent-tint-2:#4f46e526; --accent-line:#4f46e555;
    --text:#0f172a; --muted:#5b6b7a; --dim:#8794a1;
    --bad:#dc2626; --warn:#b45309; --on-accent:#ffffff;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#0b0f16; --panel:#131a26; --panel-border:#212b3a;
      --surface-2:#0f1622; --surface-2-border:#233047;
      --tint:#1b2140; --header-bg:#0b0f16ee;
      --accent:#818cf8; --accent-soft:#a5b4fc;
      --accent-tint:#818cf81a; --accent-tint-2:#818cf833; --accent-line:#818cf866;
      --text:#e2e8f0; --muted:#94a3b8; --dim:#64748b;
      --bad:#f87171; --warn:#f59e0b; --on-accent:#ffffff;
    }
  }
  *{ box-sizing:border-box; }
  body{
    margin:0; font-family:var(--font-ui);
    background:var(--bg); color:var(--text);
    padding-bottom:calc(74px + env(safe-area-inset-bottom));
  }
  header{
    padding:10px 12px; position:sticky; top:0;
    background:var(--header-bg); backdrop-filter:blur(8px); z-index:10;
    border-bottom:1px solid var(--panel-border);
  }
  h1{ font-size:17px; margin:0; }
  .sub{ color:var(--dim); font-size:11.5px; line-height:1.35; }

  main{ max-width:720px; margin:0 auto; padding:12px 12px 40px; }

  /* Filter chips — one row, wrapped, never sideways-scrolled. */
  .chips{ display:flex; flex-wrap:wrap; gap:8px; margin:4px 0 14px; }
  .chip{
    min-height:36px; padding:7px 13px; border-radius:20px; cursor:pointer;
    background:var(--panel); border:1px solid var(--panel-border);
    color:var(--text); font-family:inherit; font-size:12.5px; font-weight:600;
  }
  .chip.is-on{ background:var(--accent); color:var(--on-accent); border-color:transparent; }
  button:active:not([disabled]){ filter:brightness(.92); }

  .post{
    background:var(--panel); border:1px solid var(--panel-border);
    border-radius:14px; padding:15px 16px; margin-bottom:12px;
    box-shadow:0 1px 2px rgba(15,23,42,.05);
  }
  .post-top{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .post-type{
    font-size:10px; font-weight:800; text-transform:uppercase; letter-spacing:.6px;
    color:var(--accent-soft); background:var(--accent-tint);
    border:1px solid var(--accent-line); border-radius:20px; padding:2px 8px;
  }
  .post-when{ font-size:10.5px; text-transform:uppercase; letter-spacing:.4px; color:var(--dim); }
  .post-title{ font-size:15px; font-weight:700; margin-top:7px; line-height:1.4; }
  .post-body{
    font-family:var(--font-read); font-size:13.5px; line-height:1.65;
    color:var(--text); margin-top:8px; white-space:pre-line; overflow-wrap:break-word;
  }
  .post-body a{ color:var(--accent-soft); font-weight:600; }
  /* Long posts (a jobs list, a mock) open in place rather than pushing the
     rest of the feed a screen away. */
  .post-body.is-folded{ max-height:180px; overflow:hidden;
    -webkit-mask-image:linear-gradient(180deg,#000 60%,transparent);
    mask-image:linear-gradient(180deg,#000 60%,transparent); }
  .post-more{
    margin-top:8px; background:none; border:0; padding:6px 0; cursor:pointer;
    color:var(--accent-soft); font-family:inherit; font-size:12.5px; font-weight:700;
  }

  .empty{ text-align:center; color:var(--muted); padding:40px 20px; font-size:13.5px; line-height:1.6; }
  .retry{ margin-top:12px; font-family:inherit; font-size:12.5px; font-weight:700;
          color:var(--on-accent); background:var(--accent); border:0; border-radius:8px;
          padding:9px 16px; min-height:38px; cursor:pointer; }
  .age-row{ display:flex; align-items:center; justify-content:space-between; gap:10px;
            margin-bottom:10px; }
  .view-all{ background:none; border:0; padding:6px 4px; color:var(--accent-soft); font:inherit;
             font-size:12px; font-weight:700; cursor:pointer; min-height:34px; }
  #loadMore{
    display:block; width:100%; min-height:44px; margin-top:4px; cursor:pointer;
    background:var(--panel); color:var(--text); border:1px solid var(--panel-border);
    border-radius:10px; font-family:inherit; font-size:13px; font-weight:600;
  }
  .owner-key{ width:100%; box-sizing:border-box; margin:12px 0; min-height:44px; padding:10px; border:1px solid var(--panel-border); border-radius:8px; background:var(--panel); color:var(--text); font:inherit; }
  #unlockMessage{ color:var(--muted); margin-top:10px; }
  .hidden{ display:none !important; }
</style>
</head>
<body data-page="feed">
<header>
  <div class="nav-bar">
    <button class="nav-burger" id="nav-hamburger" aria-label="Open menu" aria-expanded="false">
      <svg class="nav-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
           stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
    </button>
    <div class="nav-title">
      <h1 id="screen-title">Instinct</h1>
      <div class="nav-exam" id="nav-exam"></div>
    </div>
  </div>
</header>

<main>
  <div class="age-row">
    <span class="sub" id="feedStatus">Private feed</span>
    <button class="view-all hidden" id="lockBtn">Lock feed</button>
    <button class="view-all" id="refreshBtn">↻ Refresh</button>
  </div>
  <section class="empty" id="unlockPanel" aria-label="Unlock private feed">
    <h2>Private feed</h2>
    <p>Enter your owner read key to see your posts. It stays only in this tab until you leave or lock the feed.</p>
    <form id="unlockForm">
      <label for="ownerKey">Owner read key</label>
      <input class="owner-key" id="ownerKey" type="password" autocomplete="off" spellcheck="false" required>
      <button class="retry" type="submit">Unlock feed</button>
    </form>
    <p id="unlockMessage" role="status" aria-live="polite"></p>
  </section>
  <div class="chips" id="chips"></div>
  <div id="feed"></div>
  <button id="loadMore" class="hidden">Show earlier posts</button>
</main>

<script src="/prep/exams.js"></script>
<script src="/app/feed.js"></script>
</body>
</html>
